# Auto-Trader System Configuration
# Copy this file to config.yaml and customize as needed
#
# This file contains APPLICATION BEHAVIOR settings that define
# how the system operates. For deployment-specific settings and
# secrets, use .env file instead.

# ============================================================
# IBKR BEHAVIOR CONFIGURATION
# ============================================================
# Connection settings (host, port, client_id) come from .env file
# These are behavioral settings for how the client operates
ibkr:
  timeout: 30                    # Connection timeout in seconds
  reconnect_attempts: 5          # Maximum reconnection attempts before circuit breaker opens
  graceful_shutdown: true        # Close positions on shutdown

# ============================================================
# RISK MANAGEMENT CONFIGURATION
# ============================================================
# System-wide risk limits and safeguards
risk:
  max_position_percent: 10.0      # Maximum position size as % of account value
  daily_loss_limit_percent: 2.0   # Daily loss limit as % of account value  
  max_open_positions: 5           # Maximum number of concurrent positions
  min_account_balance: 1000       # Minimum account balance required to trade
  max_concurrent_trades: 10       # Maximum trades processing simultaneously
  max_portfolio_risk_percent: 10.0 # Maximum total portfolio risk allowed

# ============================================================
# TRADING SYSTEM CONFIGURATION  
# ============================================================
# Core trading engine behavior
trading:
  simulation_mode: true           # Set to false for live trading (can be overridden by .env)
  market_hours_only: true         # Only trade during regular market hours
  default_timeframe: "15min"      # Default timeframe for execution functions
  order_timeout: 60               # Order timeout in seconds
  # Future settings:
  # enable_premarket: false      # Allow premarket trading
  # enable_afterhours: false     # Allow after-hours trading
  # max_slippage_percent: 0.5    # Maximum acceptable slippage

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
# Application logging behavior
logging:
  level: "INFO"                   # DEBUG, INFO, WARNING, ERROR, CRITICAL (can be overridden by DEBUG env var)
  rotation: "1 day"               # Log rotation frequency
  retention: "30 days"            # How long to keep old logs
  format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level} | {name}:{function}:{line} | {message}"
  # Log categories (future enhancement):
  # trade_logs: true              # Separate trade execution logs
  # risk_logs: true               # Separate risk management logs
  # performance_logs: false       # Performance metrics logging

# ============================================================
# SIMULATION MODE CONFIGURATION
# ============================================================
# Configuration for simulation/testing mode (Story 3.4)
simulation:
  enabled: true                         # Enable simulation mode
  data_file: "data/simulation/test_bars.csv"  # Path to simulation data file
  playback_mode: "instant"              # instant, sequential, or real_time
  speed_multiplier: 1.0                 # Playback speed (1.0 = real-time)