# Trade Plan Template - Close Below Entry Strategy
# ==================================================
# This template creates a short position when price closes below a threshold level.
# 
# STRATEGY: Breakdown/Support-turned-resistance entries  
# RISK LEVEL: Medium-High (suitable for bear markets or short-term reversals)
# TIMEFRAME: Intraday to short-term holds
# 
# COMMON USE CASES:
# • Breaking below key support levels
# • Failed bounce from resistance (short)
# • Trend continuation after bear flag
# • Breakdown from consolidation patterns

# TRADE IDENTIFICATION
# =====================

# Unique plan identifier (REQUIRED)
# Format: SYMBOL_YYYYMMDD_NNN (where NNN is sequence number 001-999)
# This ID must be unique across all your trade plans
# Example: AAPL_20250815_002, QQQ_20250815_001 (for short trades)
plan_id: "SYMBOL_YYYYMMDD_001"  # 📝 UPDATE THIS: Your unique plan ID

# Trading instrument symbol (REQUIRED) 
# Must be valid ticker symbol (1-10 uppercase letters)
# Note: Ensure your broker allows short selling for this symbol
# Examples: AAPL, MSFT, SPY (ETFs often easier to short)
symbol: "SYMBOL"  # 📝 UPDATE THIS: Your trading symbol

# Entry price level (REQUIRED)
# The price where you want to enter the trade
# Decimal with maximum 4 decimal places
# Example: 180.50
entry_level: 0.00

# Stop loss price (REQUIRED)
# Your maximum loss exit point
# For LONG positions: must be BELOW entry_level
# For SHORT positions: must be ABOVE entry_level
# Example: 182.00 (for short position with entry at 180.50)
stop_loss: 0.00

# Take profit target (REQUIRED)
# Your profit-taking exit point
# For LONG positions: must be ABOVE entry_level
# For SHORT positions: must be BELOW entry_level
# Example: 175.00 (for short position with entry at 180.50)
take_profit: 0.00

# Risk category (REQUIRED)
# Determines position sizing as percentage of account
# Valid values:
#   "small"  - 1% account risk
#   "normal" - 2% account risk
#   "large"  - 3% account risk
risk_category: "normal"

# Entry execution function (REQUIRED)
# Defines when to enter the trade
entry_function:
  # Function type for entry trigger
  function_type: "close_below"
  
  # Timeframe for candle evaluation
  # Valid values: 1min, 5min, 15min, 30min, 60min, 240min, 1440min, 1h, 4h, 1d
  # Recommendation: Use 15min or higher to avoid noise
  timeframe: "15min"
  
  # Function-specific parameters
  parameters:
    # Price threshold for close_below function
    # Trade enters when candle closes BELOW this price
    # Typically same as entry_level, but can be different for buffer
    threshold: 0.00

# Exit strategy configuration (REQUIRED)
# Defines when to exit the trade using two independent functions

# Stop loss exit function (REQUIRED)
# For SHORT positions: triggers when price closes ABOVE stop_loss level
stop_loss_function:
  # Exit mechanism: close_above function (for short protection)
  # Exits trade when candle CLOSES above stop loss price
  function_type: "close_above"

  # Timeframe for stop loss monitoring (REQUIRED)
  # Faster timeframes = quicker stop loss execution
  # 💡 RECOMMENDED: 1min for rapid stop-loss execution
  timeframe: "1min"  # 📝 UPDATE THIS: Your stop loss monitoring timeframe

  # Stop loss parameters
  parameters:
    # Threshold should match your stop_loss price above
    # Trade exits when {timeframe} candle closes ABOVE this level
    threshold: 0.00  # 📝 UPDATE THIS: Same as stop_loss value

# Take profit exit function (REQUIRED)
# For SHORT positions: triggers when price closes BELOW take_profit level
take_profit_function:
  # Exit mechanism: close_below function (for short profit)
  # Exits trade when candle CLOSES below take profit price
  function_type: "close_below"

  # Timeframe for take profit monitoring (REQUIRED)
  # Can use different timeframe than stop loss for optimal exits
  # 💡 RECOMMENDED: 1min or 5min depending on strategy
  timeframe: "1min"  # 📝 UPDATE THIS: Your take profit monitoring timeframe

  # Take profit parameters
  parameters:
    # Threshold should match your take_profit price above
    # Trade exits when {timeframe} candle closes BELOW this level
    threshold: 0.00  # 📝 UPDATE THIS: Same as take_profit value

# Initial status (OPTIONAL)
# Valid values: awaiting_entry, position_open, completed, cancelled, error
# Default: awaiting_entry
# status: "awaiting_entry"

# Example Complete Configuration (SHORT position):
# plan_id: "AAPL_20250815_002"
# symbol: "AAPL"
# entry_level: 180.50
# stop_loss: 182.00    # Above entry for short protection
# take_profit: 175.00  # Below entry for short profit
# risk_category: "normal"
# entry_function:
#   function_type: "close_below"
#   timeframe: "15min"
#   parameters:
#     threshold: 180.50
# stop_loss_function:
#   function_type: "close_above"  # For short: exit when closes ABOVE stop
#   timeframe: "1min"
#   parameters:
#     threshold: 182.00
# take_profit_function:
#   function_type: "close_below"  # For short: exit when closes BELOW target
#   timeframe: "1min"
#   parameters:
#     threshold: 175.00

# Common Use Cases:
# 1. Breakdown trades: Enter short when support breaks
# 2. Pullback entries: Enter long when dip reaches target
# 3. Range trading: Enter when price reaches range bottom