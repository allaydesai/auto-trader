# entry_level: 250.00      # Post-earnings breakout
# stop_loss: 245.00        # Tight 5-point stop
# take_profit: 265.00      # 15-point target (3:1 R:R)
# risk_category: "large"   # Aggressive 3% risk
# entry_function:
#   function_type: "close_above"
#   timeframe: "5min"      # Fast execution on volatility
#   parameters:
#     threshold: 250.25    # Small buffer for confirmation
# stop_loss_function:
#   function_type: "close_below"
#   timeframe: "1min"      # Very fast stop loss on volatility
#   parameters:
#     threshold: 245.00
# take_profit_function:
#   function_type: "close_above"
#   timeframe: "1min"      # Fast take profit
#   parameters:
#     threshold: 265.00

# QUICK START CHECKLIST
# =====================
# Before saving this file:
# □ Update plan_id with unique identifier
# □ Set symbol to your target stock/ETF  
# □ Define entry_level based on technical analysis
# □ Set stop_loss below key support (for longs)
# □ Set take_profit at realistic target
# □ Choose appropriate risk_category
# □ Adjust timeframe based on trade style
# □ Set threshold = entry_level (or slightly higher)
# □ Verify all required fields are filled
# □ Save file and run: auto-trader validate-plans

