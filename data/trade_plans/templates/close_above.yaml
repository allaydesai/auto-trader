# Trade Plan Template - Close Above Entry Strategy
# =================================================
# This template creates a long position when price closes above a threshold level.
# 
# STRATEGY: Breakout/Support-turned-resistance entries
# RISK LEVEL: Medium (suitable for trending markets)
# TIMEFRAME: Intraday to multi-day holds
# 
# COMMON USE CASES:
# • Breaking above key resistance levels
# • Support-turned-resistance retests  
# • Trend continuation after pullbacks
# • Breakout from consolidation patterns

# TRADE IDENTIFICATION
# =====================

# Unique plan identifier (REQUIRED)
# Format: SYMBOL_YYYYMMDD_NNN (where NNN is sequence number 001-999)
# This ID must be unique across all your trade plans
# Example: AAPL_20250815_001, MSFT_20250815_002
plan_id: "SYMBOL_YYYYMMDD_001"  # 📝 UPDATE THIS: Your unique plan ID

# Trading instrument symbol (REQUIRED) 
# Must be valid ticker symbol (1-10 uppercase letters)
# Supported exchanges: NYSE, NASDAQ, major ETFs
# Examples: AAPL, MSFT, GOOGL, SPY, QQQ, IWM
symbol: "SYMBOL"  # 📝 UPDATE THIS: Your trading symbol

# PRICE LEVELS & RISK MANAGEMENT
# ===============================

# Entry trigger level (REQUIRED)
# The price threshold that triggers trade entry
# Format: Decimal with up to 4 decimal places (USD)
# Strategy: Set just above key resistance or breakout level
# Example: 180.50 (for Apple stock breakout)
entry_level: 0.00  # 📝 UPDATE THIS: Your entry trigger price

# Stop loss protection (REQUIRED)  
# Your maximum acceptable loss exit point
# ⚠️  CRITICAL: For LONG trades, must be BELOW entry_level
# Risk calculation: (entry_level - stop_loss) × position_size = max loss
# Strategy: Set below key support or recent swing low
# Example: 178.00 (gives $2.50 risk per share at 180.50 entry)
stop_loss: 0.00  # 📝 UPDATE THIS: Your stop loss price

# Profit target (REQUIRED)
# Your profit-taking exit point for partial or full position
# 💰 For LONG trades, must be ABOVE entry_level  
# Risk:Reward calculation: (take_profit - entry_level) / (entry_level - stop_loss)
# Strategy: Set at next resistance level or measured move target
# Example: 185.00 (gives 1.8:1 reward:risk ratio with above levels)
take_profit: 0.00  # 📝 UPDATE THIS: Your profit target

# Position size category (REQUIRED)
# Determines how much capital to risk on this trade
# Risk categories affect position sizing:
#   "small"  → 1% of account balance at risk (conservative)
#   "normal" → 2% of account balance at risk (balanced)  
#   "large"  → 3% of account balance at risk (aggressive)
# ⚠️  WARNING: Large positions increase both profit and loss potential
risk_category: "normal"  # 📝 UPDATE THIS: small/normal/large

# EXECUTION STRATEGY
# ==================

# Entry trigger configuration (REQUIRED)
# Defines the exact conditions for entering the trade
entry_function:
  # Entry mechanism: close_above function
  # Enters trade when candle CLOSES above threshold price
  # This avoids false breakouts from wicks/spikes
  function_type: "close_above"
  
  # Timeframe for price evaluation (REQUIRED)
  # Larger timeframes = fewer false signals, slower execution
  # Smaller timeframes = faster execution, more noise
  # Available: 1min, 5min, 15min, 30min, 1h, 2h, 4h, 1d
  # 💡 RECOMMENDED: 15min (good balance of speed vs reliability)
  timeframe: "15min"  # 📝 UPDATE THIS: Your preferred timeframe
  
  # Entry function parameters
  parameters:
    # Price threshold for entry trigger (REQUIRED)
    # Trade executes when {timeframe} candle closes ABOVE this level
    # 💡 TIP: Often same as entry_level, or slightly higher for confirmation
    # Example: 180.50 (enters when 15min candle closes above $180.50)
    threshold: 0.00  # 📝 UPDATE THIS: Your entry threshold

# Exit strategy configuration (REQUIRED)
# Defines how and when to exit the position using two independent functions

# Stop loss exit function (REQUIRED)
# Triggers when price closes below stop_loss level
stop_loss_function:
  # Exit mechanism: close_below function
  # Exits trade when candle CLOSES below stop loss price
  # This avoids premature exit from wicks/spikes
  function_type: "close_below"

  # Timeframe for stop loss monitoring (REQUIRED)
  # Faster timeframes = quicker stop loss execution
  # 💡 RECOMMENDED: 1min for rapid stop-loss execution
  timeframe: "1min"  # 📝 UPDATE THIS: Your stop loss monitoring timeframe

  # Stop loss parameters
  parameters:
    # Threshold should match your stop_loss price above
    # Trade exits when {timeframe} candle closes BELOW this level
    threshold: 0.00  # 📝 UPDATE THIS: Same as stop_loss value

# Take profit exit function (REQUIRED)
# Triggers when price closes above take_profit level
take_profit_function:
  # Exit mechanism: close_above function
  # Exits trade when candle CLOSES above take profit price
  function_type: "close_above"

  # Timeframe for take profit monitoring (REQUIRED)
  # Can use different timeframe than stop loss for optimal exits
  # 💡 RECOMMENDED: 1min or 5min depending on strategy
  timeframe: "1min"  # 📝 UPDATE THIS: Your take profit monitoring timeframe

  # Take profit parameters
  parameters:
    # Threshold should match your take_profit price above
    # Trade exits when {timeframe} candle closes ABOVE this level
    threshold: 0.00  # 📝 UPDATE THIS: Same as take_profit value

# SYSTEM MANAGEMENT (OPTIONAL)
# =============================

# Initial plan status (OPTIONAL)
# The system automatically sets this to "awaiting_entry" if not specified
# Advanced users can set other statuses for plan management
# Valid options: awaiting_entry, position_open, completed, cancelled, error
# 💡 LEAVE COMMENTED unless you need specific status control
# status: "awaiting_entry"

# COMPLETE EXAMPLE CONFIGURATIONS
# ===============================
